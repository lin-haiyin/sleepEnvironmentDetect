<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>env-s3-01 MQTT Control</title><script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
<style>body{font:16px system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#f6f7f9;color:#20242a}section{background:#fff;border:1px solid #ddd;border-radius:10px;padding:1rem;margin:1rem 0}label{display:inline-flex;flex-direction:column;gap:.25rem;margin:.25rem .5rem .25rem 0}input{padding:.45rem;width:18rem;max-width:80vw}button{padding:.55rem .8rem;margin:.25rem;border:1px solid #aaa;border-radius:6px;background:#fff;cursor:pointer}.row{display:flex;flex-wrap:wrap;align-items:center}.status{font-weight:600;margin-left:.5rem}.ok{color:#087f23}.bad{color:#b00020}pre{max-height:280px;overflow:auto;background:#111;color:#ddd;padding:.8rem;border-radius:6px;white-space:pre-wrap}</style></head>
<body><h1>env-s3-01 MQTT Control</h1>
<section><div class="row"><label>MQTT WebSocket URL<input id="url" value="ws://broker.example.com:8083/mqtt"></label><label>Device ID<input id="device" value="env-s3-01"></label><label>Username<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label></div><button id="connect">Connect</button><button id="disconnect">Disconnect</button><span id="status" class="status bad">Disconnected</span></section>
<section><h2>KY-016 RGB LED</h2><button data-rgb="0">Off</button><button data-rgb="1">Red</button><button data-rgb="2">Green</button><button data-rgb="3">Blue</button></section>
<section><h2>WS2812B LED Strip</h2><button data-led="0">Off</button><button data-led="7">Warm breathe</button><button data-led="8">Cool blue breathe</button><button data-led="9">Rainbow chase</button></section>
<section><h2>Messages</h2><pre id="log">Not connected</pre></section>
<script>
let client=null;const $=id=>document.getElementById(id);function setStatus(text,good){$('status').textContent=text;$('status').className='status '+(good?'ok':'bad')}function log(text){$('log').textContent=new Date().toLocaleTimeString()+' '+text+'\n'+$('log').textContent}function topic(suffix){return $('device').value.trim()+'/'+suffix}function publish(name,payload){if(!client||!client.connected){log('Not connected; command not sent');return}client.publish(name,payload,{qos:1});log('TX '+name+' = '+payload)}
$('connect').onclick=()=>{if(client)client.end(true);setStatus('Connecting...',false);client=mqtt.connect($('url').value.trim(),{username:$('user').value||undefined,password:$('pass').value||undefined,clientId:'web-'+Math.random().toString(16).slice(2)});client.on('connect',()=>{setStatus('Connected',true);log('MQTT connected');client.subscribe(topic('status'));client.subscribe(topic('sensor/#'));client.subscribe(topic('actuator/+/state'))});client.on('message',(name,message)=>log('RX '+name+' = '+message.toString()));client.on('error',error=>{setStatus('Error',false);log('MQTT error: '+error.message)});client.on('close',()=>setStatus('Disconnected',false))};$('disconnect').onclick=()=>{if(client)client.end(true);setStatus('Disconnected',false)};document.querySelectorAll('[data-rgb]').forEach(button=>button.onclick=()=>publish(topic('actuator/rgb/set'),button.dataset.rgb));document.querySelectorAll('[data-led]').forEach(button=>button.onclick=()=>publish(topic('actuator/led/set'),button.dataset.led));
</script></body></html>
